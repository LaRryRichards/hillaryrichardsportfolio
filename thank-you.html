<style>
  :root{ --bg:#050505; --red:#E10600; --red-text:#FF4A3D; --white:#F5F5F5; --muted:#A0A0A0; --border:rgba(245,245,245,0.09);
    --font-display:'Space Grotesk',system-ui,sans-serif; --font-body:'Inter',system-ui,sans-serif; --font-mono:'JetBrains Mono',ui-monospace,monospace; }
  @media (prefers-color-scheme: light){ :root:not([data-theme="dark"]){ --bg:#F7F7F5; --white:#0A0A0A; --muted:#5C5C5C; --border:rgba(10,10,10,0.1); --red-text:#C20500; } }
  :root[data-theme="light"]{ --bg:#F7F7F5; --white:#0A0A0A; --muted:#5C5C5C; --border:rgba(10,10,10,0.1); --red-text:#C20500; }
  :root[data-theme="dark"]{ --bg:#050505; --white:#F5F5F5; --muted:#A0A0A0; --border:rgba(245,245,245,0.09); --red-text:#FF4A3D; }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ min-height:100%; }
  body{ background:var(--bg); color:var(--white); font-family:var(--font-body); line-height:1.6; display:flex; align-items:center; justify-content:center; text-align:center; padding:24px; position:relative; overflow-x:hidden; min-height:100vh; }
  .bg{ position:absolute; inset:0; z-index:0; background-image:linear-gradient(var(--border) 1px, transparent 1px), linear-gradient(90deg, var(--border) 1px, transparent 1px); background-size:56px 56px; -webkit-mask-image:radial-gradient(ellipse 70% 60% at 50% 45%, black 30%, transparent 85%); mask-image:radial-gradient(ellipse 70% 60% at 50% 45%, black 30%, transparent 85%); }
  main{ position:relative; z-index:1; max-width:520px; }
  .logo{ height:56px; width:auto; margin:0 auto 28px; display:block; }
  .code{ font-family:var(--font-mono); font-size:13px; letter-spacing:0.14em; text-transform:uppercase; color:var(--red-text); margin-bottom:18px; display:flex; align-items:center; justify-content:center; gap:10px; }
  .code::before, .code::after{ content:''; width:22px; height:1px; background:var(--red); }
  h1{ font-family:var(--font-display); font-weight:700; font-size:clamp(34px,8vw,64px); line-height:1.05; text-transform:uppercase; }
  h1 span{ color:var(--red-text); }
  p.lead{ color:var(--muted); margin-top:20px; font-size:16px; }
  .actions{ display:flex; gap:12px; justify-content:center; flex-wrap:wrap; margin-top:34px; }
  .btn{ display:inline-flex; align-items:center; min-height:48px; padding:14px 26px; font-family:var(--font-mono); font-size:13px; letter-spacing:0.06em; text-transform:uppercase; background:var(--red); color:#F5F5F5; text-decoration:none; border-radius:2px; border:1px solid var(--red); transition:transform .2s ease, background .2s ease; }
  .btn:hover{ background:#c00500; transform:translateY(-2px); }
  .btn.secondary{ background:transparent; color:var(--white); border-color:var(--border); }
  .btn.secondary:hover{ border-color:var(--red); background:transparent; }
  a:focus-visible{ outline:2px solid var(--red); outline-offset:3px; }
  @media (prefers-reduced-motion: reduce){ *{ transition:none !important; } }
</style>
</head>
<body>
  <div class="bg" aria-hidden="true"></div>
  <main>
    <img class="logo" src="assets/img/logo.f10b5e6d.webp" alt="Hillary Richards" width="440" height="401">
    <p class="code">Message received</p>
    <h1>Message <span>sent.</span></h1>
    <p class="lead">Thank you for getting in touch. Your message has been delivered and I will reply by email or WhatsApp as soon as I can.</p>
    <div class="actions">
      <a class="btn" href="/">Back To Home →</a>
      <a class="btn secondary" href="/#work">View My Work</a>
    </div>
  </main>
</body>
